name: 'Publish to NPM if package.json''s "version" field was updated'
on:
  workflow_run:
    branches: ["main"]
    types: ["completed"]
    workflows: ["Verify: Test, lint, and typecheck"]

concurrency: publish

jobs:
  check:
    name: "Check if the version in package.json is already published to NPM"
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      exists: ${{ steps.checkpublish.outputs.exists }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6

      - name: "Testing 0"
        run: |
          npm view . --json
        id: debugcheckpublish0
      - name: "Testing 1"
        run: |
          npm view . --json | jq "if any(.[0].versions[]; . == "5.14.0") then 1 else 0 end"
        id: debugcheckpublish1
      - name: "Testing 2"
        run: |
          npm pkg get version --json
        id: debugcheckpublish2
      - name: "Testing 3"
        run: |
          npm pkg get version --json | jq .version
        id: debugcheckpublish3
      - name: "See if the version from package.json has been published already"
        run: |
          echo "exists=$(npm view . --json | jq "if any(.[0].versions[]; . == $(npm pkg get version --json | jq .version)) then 1 else 0 end")" >> $GITHUB_OUTPUT
        id: checkpublish

  publish:
    name: "Publish to NPM"
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.exists == '0' # Do not run if NPM already has this version
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6

      - name: "Install NPM"
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: "Log in to DockerHub"
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: "Build an image containing everything needed for building the library"
        run: docker compose -f ci-pack.docker-compose.yml build

      - name: "Pack"
        run: docker compose -f ci-pack.docker-compose.yml run --rm ci-pack

      - name: "Publish the package"
        run: npm publish --provenance ./dist-pack/latest.tgz

permissions:
  id-token: write # Needed for provenance and for OIDC (used by NPM Trusted Publishing)
